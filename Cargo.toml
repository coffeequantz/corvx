[workspace]
resolver = "2"
members = [
    "crates/corvx-proto",
    "crates/corvx-core",
    "crates/corvx-client",
    "crates/corvxd",
    "crates/corvx",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
# License not chosen yet; see CORVX_SPEC.md. Do not publish until decided.
publish = false

[workspace.dependencies]
corvx-proto = { path = "crates/corvx-proto" }
corvx-core = { path = "crates/corvx-core" }
corvx-client = { path = "crates/corvx-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
tempfile = "3"
base64 = "0.22"
portable-pty = "0.9"
libc = "0.2"
